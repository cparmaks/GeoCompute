    #   mgmt-ipv4: 192.168.200.23
    #   exec:
    #     - bash /config/svr-03.sh
    #   labels:
    #     graph-level: 4
    #   image: ghcr.io/srl-labs/network-multitool
    # 1tier-svr-04:
    #   kind: linux
    #   mgmt-ipv4: 192.168.200.24
    #   exec:
    #     - bash /config/svr-04.sh
    #   labels:
    #     graph-level: 4
    #   image: ghcr.io/srl-labs/network-multitool

    # ssh:
