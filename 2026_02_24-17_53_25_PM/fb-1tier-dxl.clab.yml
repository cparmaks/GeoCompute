name: fb-1tier-dxl
prefix: ''

mgmt:
  network: fb-1tier-dxl_mgt
  ipv4-subnet: 192.168.200.0/24
  ipv4-gw: 192.168.200.1

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:25.10.1
      type: ixr-h4
    linux:
      image: ghcr.io/srl-labs/network-multitool
      type: linux
      binds:
        - initial_configs:/config
  nodes:

    # Fabric Nodes
    myleaf01:
      kind: srl
      type: ixr-d3l
      mgmt-ipv4: 192.168.200.2
      image: ghcr.io/nokia/srlinux:24.7.2
      binds:
        - myleaf01.cfg:/home/admin/fb.cfg
      exec:
        - sr_cli source /home/admin/fb.cfg
      labels:
        graph-level: 3
    myleaf02:
      kind: srl
      type: ixr-d3l
      mgmt-ipv4: 192.168.200.3
      image: ghcr.io/nokia/srlinux:24.7.2
      binds:
        - myleaf02.cfg:/home/admin/fb.cfg
      exec:
        - sr_cli source /home/admin/fb.cfg
      labels:
        graph-level: 3

    # Servers
    1tier-svr-01:
      kind: linux
      mgmt-ipv4: 192.168.200.21
      exec:
        - bash /config/svr-01.sh
      labels:
        graph-level: 4
      image: ghcr.io/srl-labs/network-multitool
    1tier-svr-02:
      kind: linux
      mgmt-ipv4: 192.168.200.22
      exec:
        - bash /config/svr-02.sh
      # binds:
      #   - ./srl-configs/leaf-08v1.cfg:/home/admin/leaf-08.cfg
      labels:
        graph-level: 4
      image: ghcr.io/srl-labs/network-multitool
    # 1tier-svr-03:
