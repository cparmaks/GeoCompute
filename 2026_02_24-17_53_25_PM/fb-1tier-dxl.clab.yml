  links:
    - endpoints:
        - myleaf01:e1-29
        - myleaf02:e1-29
    - endpoints:
        - myleaf01:e1-30
        - myleaf02:e1-30

    # Leaf nodes to GPU Servers
    - endpoints: [ myleaf01:e1-1-1, 1tier-svr-01:eth1 ]
    - endpoints: [ myleaf01:e1-1-2, 1tier-svr-01:eth2 ]
    - endpoints: [ myleaf01:e1-1-3, 1tier-svr-01:eth3 ]

    - endpoints: [ myleaf02:e1-1-1, 1tier-svr-02:eth1 ]
    - endpoints: [ myleaf02:e1-1-2, 1tier-svr-02:eth2 ]
    - endpoints: [ myleaf02:e1-1-3, 1tier-svr-02:eth3 ]

