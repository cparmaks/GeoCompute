#--------------------------------------------------
echo "EVPN Services / IP VRF: L3-1-MY_IP_VRF_Tagged"
#--------------------------------------------------
tunnel-interface vxlan1 {
    vxlan-interface 1 {
        type routed
        ingress {
            vni 1
        }
        egress {
            source-ip use-system-ipv4-address
        }
    }
}
network-instance L3-1-MY_IP_VRF_Tagged {
    type ip-vrf
    admin-state enable
    description "L3-NET 1 MY_IP_VRF_Tagged"
    protocols {
        bgp-evpn {
            bgp-instance 1 {
                admin-state enable
                vxlan-interface vxlan1.1
                evi 1
                ecmp 8
                routes {
                    route-table {
                        mac-ip {
                            advertise-gateway-mac true
                        }
                    }
                }
            }
        }
        bgp-vpn {
            bgp-instance 1 {
                route-target {
                    export-rt target:65501:1
                    import-rt target:65501:1
                }
            }
        }
    }
    vxlan-interface vxlan1.1 {
    }
}
interface irb1 {
    admin-state enable
    description "L3-NET 1 MY_IP_VRF_Tagged"
}
