#--------------------------------------------------
echo "System / CPM Filters"
#--------------------------------------------------
acl {
    acl-filter cpm type ipv4 {
        statistics-per-entry true
        entry 10 {
            description "Accept incoming ICMP unreachable messages"
            action {
                accept {
                    rate-limit {
                        system-cpu-policer icmp
                    }
                }
            }
            match {
                ipv4 {
                    protocol icmp
                    icmp {
                        type dest-unreachable
                        code [
                            0
                            1
                            2
                            3
                            4
                            13
                        ]
                    }
                }
            }
        }
        entry 20 {
            description "Accept incoming ICMP time-exceeded messages"
            action {
                accept {
                    rate-limit {
                        system-cpu-policer icmp
                    }
                }
            }
            match {
                ipv4 {
                    protocol icmp
                    icmp {
                        type time-exceeded
                    }
                }
            }
        }
        entry 30 {
            description "Accept incoming ICMP parameter problem messages"
            action {
                accept {
                    rate-limit {
                        system-cpu-policer icmp
                    }
                }
            }
            match {
                ipv4 {
                    protocol icmp
                    icmp {
                        type param-problem
                    }
                }
            }
        }
        entry 40 {
            description "Accept incoming ICMP echo messages"
            action {
                accept {
                    rate-limit {
                        system-cpu-policer icmp
                    }
                }
            }
            match {
                ipv4 {
                    protocol icmp
                    icmp {
                        type echo
