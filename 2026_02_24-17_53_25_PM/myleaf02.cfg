#--------------------------------------------------
echo "System / Management Network Instance (OOB)"
#--------------------------------------------------
network-instance mgmt {
    type ip-vrf
    admin-state enable
    description "Management network instance"
    interface mgmt0.0 {
    }
    static-routes {
        route 0.0.0.0/0 {
            next-hop-group grp1
        }
    }
    next-hop-groups {
        group grp1 {
            admin-state enable
            nexthop 1 {
                ip-address 192.168.200.1
            }
        }
    }
}
interface mgmt0 {
    admin-state enable
    subinterface 0 {
        admin-state enable
        ipv4 {
            admin-state enable
            address 192.168.200.3/24 {
            }
        }
    }
}
#--------------------------------------------------
echo "System / Base Configuration"
#--------------------------------------------------
system {
    name {
        host-name "myleaf02"
        domain-name "mydomain.com"
    }
    load-balancing {
        hash-options {
            hash-seed 2562
        }
    }
    banner {
        motd-banner "................................................................
:                   1-Tier Topology (IXR-D3L)                  :
................................................................"
    }
}
#--------------------------------------------------
echo "System / SSH"
#--------------------------------------------------
system {
  ssh-server ssh-mgmt {
    network-instance mgmt
    admin-state enable
    timeout 900
    rate-limit 3
  }
}
#--------------------------------------------------
echo "System / Time & NTP"
#--------------------------------------------------
system {
  clock {
    timezone UTC
  }
  ntp {
    admin-state enable
    network-instance mgmt
    server 192.168.10.11 {
      prefer true
      iburst false
    }
    server 192.168.10.12 {
      prefer false
      iburst false
    }
  }
}
#--------------------------------------------------
echo "System / DNS"
#--------------------------------------------------
system {
  dns {
    network-instance mgmt
    server-list [
      192.168.10.10
    ]
  }
}
#--------------------------------------------------
echo "System / Default MTU"
#--------------------------------------------------
system {
    mtu {
        default-port-mtu 9412
        default-l2-mtu 9412
        default-ip-mtu 9394
    }
}
#--------------------------------------------------
echo "System / LLDP"                          
#--------------------------------------------------
system {
    lldp {
        admin-state enable
    }
}
#--------------------------------------------------
echo "System / Auto-boot"
#--------------------------------------------------
system {
    boot {
        autoboot {
            admin-state disable
        }
    }
}
#--------------------------------------------------
echo "System / SGT Marking"
#--------------------------------------------------
system {
    control-plane-traffic {
        output {
            qos {
                management-protocols-dscp 63
            }
        }
    }
}
#--------------------------------------------------
echo "System / Loopback Interface"
#--------------------------------------------------
interface system0 {
    description system
    admin-state enable
    subinterface 0 {
        admin-state enable
        ipv4 {
            admin-state enable
            address 10.0.0.2/32 {
            }
        }
    }
}
bfd {
  subinterface system0.0 {
    admin-state enable
    desired-minimum-transmit-interval 100000
    required-minimum-receive 100000
    detection-multiplier 3
    minimum-echo-receive-interval 0
  }
}
#--------------------------------------------------
echo "System / Default Network Instance"
#--------------------------------------------------
network-instance default {
    type default
    admin-state enable
    description "Default network instance"
    interface system0.0 {
    }
}
#--------------------------------------------------
echo "System / Logging"
#--------------------------------------------------
system {
    logging {
        network-instance mgmt
        # Default log facility for SR Linux subsystems
        subsystem-facility local6
        # Buffer linux system logs > warning
        # /var/log/srlinux/buffer/system
        buffer system {
            facility auth {
                priority {
                    match-above warning
                }
            }
            facility cron {
                priority {
                    match-above warning
                }
            }
            facility daemon {
                priority {
                    match-above warning
                }
            }
            facility ftp {
                priority {
                    match-above warning
                }
            }
            facility kern {
                priority {
                    match-above warning
                }
            }
            facility lpr {
                priority {
                    match-above warning
                }
            }
            facility mail {
                priority {
                    match-above warning
                }
            }
            facility news {
                priority {
                    match-above warning
                }
            }
            facility syslog {
                priority {
                    match-above warning
                }
            }
            facility user {
                priority {
                    match-above warning
                }
            }
            facility uucp {
                priority {
                    match-above warning
                }
            }
            facility local0 {
                priority {
                    match-above warning
                }
            }
            facility local1 {
                priority {
                    match-above warning
                }
            }
            facility local2 {
                priority {
                    match-above warning
                }
            }
            facility local3 {
                priority {
                    match-above warning
                }
            }
            facility local4 {
                priority {
                    match-above warning
                }
            }
            facility local5 {
                priority {
                    match-above warning
                }
            }
            facility local7 {
                priority {
                    match-above warning
                }
            }
        }
        # Buffer SR Linux logs > informational
        # /var/log/srlinux/buffer/messages
        buffer messages {
            rotate 3
            size 10000000
            facility local6 {
                priority {
                    match-above informational
                }
            }
        }
        # File SR Linux logs > warning
        # /var/log/srlinux/file/messages
        file messages {
            rotate 3
            size 10000000
            facility local6 {
                priority {
                    match-above warning
                }
            }
        }
        # File ACL drops
        # /var/log/srlinux/file/acl
        file acl {
            rotate 3
            size 10000000
            subsystem acl {
            }
        }
    }
}
