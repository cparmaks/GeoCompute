#--------------------------------------------------
echo "BGP PE-CE Routing Policies"
#--------------------------------------------------
routing-policy {
    prefix-set prefix-bogonsv4 {
        prefix 0.0.0.0/8 mask-length-range 8..32 {
        }
        prefix 0.0.0.0/32 mask-length-range 32..32 {
        }
        prefix 10.0.0.0/8 mask-length-range 8..32 {
        }
        prefix 100.64.0.0/10 mask-length-range 10..32 {
        }
        prefix 127.0.0.0/8 mask-length-range 8..32 {
        }
        prefix 169.254.0.0/16 mask-length-range 16..32 {
        }
        prefix 172.16.0.0/12 mask-length-range 12..32 {
        }
        prefix 192.0.0.0/24 mask-length-range 24..32 {
        }
        prefix 192.0.2.0/24 mask-length-range 24..32 {
        }
        prefix 192.88.99.0/24 mask-length-range 24..32 {
        }
        prefix 192.168.0.0/16 mask-length-range 16..32 {
        }
        prefix 198.18.0.0/15 mask-length-range 15..32 {
        }
        prefix 198.51.100.0/24 mask-length-range 24..32 {
        }
        prefix 203.0.113.0/24 mask-length-range 24..32 {
        }
        prefix 224.0.0.0/4 mask-length-range 4..32 {
        }
        prefix 240.0.0.0/4 mask-length-range 4..32 {
        }
        prefix 255.255.255.255/32 mask-length-range 32..32 {
        }
    }
    prefix-set prefix-bogonsv6 {
        prefix ::/128 mask-length-range 128..128 {
        }
        prefix ::1/128 mask-length-range 128..128 {
        }
        prefix 100::/64 mask-length-range 64..128 {
        }
        prefix 2001::/23 mask-length-range 23..128 {
        }
        prefix 2001::/32 mask-length-range 32..128 {
        }
        prefix 2001:2::/48 mask-length-range 48..128 {
        }
        prefix 2001:10::/28 mask-length-range 28..128 {
        }
        prefix 2001:db8::/32 mask-length-range 32..128 {
        }
        prefix 2002::/16 mask-length-range 16..128 {
        }
        prefix fc00::/7 mask-length-range 7..7 {
        }
        prefix fe80::/10 mask-length-range 10..128 {
        }
    }
    prefix-set prefix-host-ips-v4/v6 {
        prefix 0.0.0.0/0 mask-length-range 32..32 {
        }
        prefix ::/0 mask-length-range 128..128 {
        }
    }
    prefix-set prefix-default-route-v4/v6 {
        prefix 0.0.0.0/0 mask-length-range 0..0 {
        }
        prefix ::/0 mask-length-range 0..0 {
        }
    }
    community-set ipbb-comm {
        member [
            65501:2
        ]
    }
    community-set tenant-and-ipbb-comm {
        member [
            65501:1
            65501:2
        ]
    }
    community-set tenant-comm {
        member [
            65501:1
        ]
    }
    policy export-all-v4/v6 {
        default-action {
            policy-result accept
            bgp {
                communities {
                    remove tenant-and-ipbb-comm
                }
            }
        }
    }
    policy export-default-and-custom-v4/v6 {
        default-action {
            policy-result reject
        }
        statement 10 {
            match {
                prefix-set prefix-default-route-v4/v6
            }
            action {
                policy-result accept
            }
        }
        statement 20 {
            match {
                bgp {
                    community-set ipbb-comm
                }
            }
            action {
                policy-result accept
                bgp {
                    communities {
                        remove ipbb-comm
                    }
                }
            }
        }
    }
    policy export-default-v4/v6 {
        default-action {
            policy-result reject
        }
        statement 10 {
            match {
                prefix-set prefix-default-route-v4/v6
            }
            action {
                policy-result accept
            }
        }
    }
    policy export-tenant-public-v4/v6 {
        default-action {
            policy-result accept
            bgp {
                communities {
                    remove tenant-comm
                }
            }
        }
        statement 10 {
            match {
                prefix-set prefix-default-route-v4/v6
            }
            action {
                policy-result reject
            }
        }
        statement 20 {
            match {
                bgp {
                    community-set ipbb-comm
                }
            }
            action {
                policy-result reject
            }
        }
        statement 30 {
            match {
                prefix-set prefix-bogonsv4
            }
            action {
                policy-result reject
            }
        }
        statement 40 {
            match {
                prefix-set prefix-bogonsv6
            }
            action {
                policy-result reject
            }
        }
        statement 1000 {
            match {
                bgp {
                    community-set tenant-comm
                }
            }
            action {
                policy-result accept
                bgp {
                    communities {
                        remove tenant-comm
                    }
                }
            }
        }
        statement 1010 {
            match {
                prefix-set prefix-host-ips-v4/v6
            }
            action {
                policy-result reject
            }
        }
    }
    policy export-tenant-v4/v6 {
        default-action {
            policy-result accept
            bgp {
                communities {
                    remove tenant-comm
                }
            }
        }
        statement 10 {
            match {
                prefix-set prefix-default-route-v4/v6
            }
            action {
                policy-result reject
            }
        }
        statement 20 {
            match {
                bgp {
                    community-set ipbb-comm
                }
            }
            action {
                policy-result reject
            }
        }
        statement 1000 {
            match {
                bgp {
                    community-set tenant-comm
                }
            }
            action {
                policy-result accept
                bgp {
                    communities {
                        remove tenant-comm
                    }
                }
            }
        }
        statement 1010 {
            match {
                prefix-set prefix-host-ips-v4/v6
            }
            action {
                policy-result reject
            }
        }
    }
    policy import-all-v4/v6 {
        default-action {
            policy-result accept
            bgp {
                communities {
                    add tenant-comm
                }
            }
        }
        statement 10 {
            match {
                prefix-set prefix-default-route-v4/v6
            }
            action {
                policy-result reject
            }
        }
    }
    policy import-ipbb-v4/v6 {
        default-action {
            policy-result reject
        }
        statement 10 {
            match {
                prefix-set prefix-default-route-v4/v6
            }
            action {
                policy-result accept
            }
        }
        statement 20 {
            match {
                bgp {
                    community-set ipbb-comm
                }
            }
            action {
                policy-result accept
            }
        }
    }
}

