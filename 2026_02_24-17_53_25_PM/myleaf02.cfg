            encap {
                single-tagged {
                    vlan-id 200
                }
            }
        }
    }
}
qos {
    interfaces {
        interface ethernet-1/1/1.200 {
            interface-ref {
                interface ethernet-1/1/1
                subinterface 200
            }
            input {
                classifiers {
                    dscp-policy default_edge_ingress
                }
                            
            }
        }
    }
}
network-instance L2-2-MY_L3_Tagged {
    type mac-vrf
    admin-state enable
    description "L2-NET 2 MY_L3_Tagged"
    protocols {
        bgp-evpn {
            bgp-instance 1 {
                admin-state enable
                vxlan-interface vxlan2.2
                evi 10002
                ecmp 8
                routes {
                    bridge-table {
                        next-hop use-system-ipv4-address
                        mac-ip {
                            advertise true
                        }
                        inclusive-mcast {
                            advertise true
                        }
                    }
                }
            }
        }
        bgp-vpn {
            bgp-instance 1 {
                route-target {
                    export-rt target:65501:10002
                    import-rt target:65501:10002
                }
            }
        }
    }
    vxlan-interface vxlan2.2 {
    }
    bridge-table {
        protect-anycast-gw-mac false
        mac-learning {
            admin-state enable
            aging {
                admin-state enable
                age-time 300
            }
        }
        mac-duplication {
            admin-state enable
            monitoring-window 3
            num-moves 5
            hold-down-time 9
            action oper-down
        }
        mac-limit {
            maximum-entries 250
            warning-threshold-pct 95
        }
    }
    interface ethernet-1/1/1.200 {
    }
}
interface irb1 {
    subinterface 2 {
        admin-state enable
        description "L2-NET 2 MY_L3_Tagged"
        ipv4 {
            admin-state enable
            address 172.16.10.1/24 {
                anycast-gw true
                primary
            }
            arp {
                timeout 270
                learn-unsolicited true
                host-route {
                    populate static {
                    }
                    populate dynamic {
                    }
                }
                evpn {
                    advertise static {
                    }
                    advertise dynamic {
                    }
                }
