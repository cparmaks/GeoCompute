#--------------------------------------------------
echo "Underlay / BGP"
#--------------------------------------------------
network-instance default {
    protocols {
        bgp {
            admin-state enable
            autonomous-system 64602
            router-id 10.0.0.2
            route-advertisement {
                rapid-withdrawal true
                wait-for-fib-install true
            }
            afi-safi ipv4-unicast {
                admin-state enable
                multipath {
                    allow-multiple-as true
                    maximum-paths 64
                }
            }
            afi-safi ipv6-unicast {
                admin-state enable
                multipath {
                    allow-multiple-as true
                    maximum-paths 64
                }
            }
            afi-safi evpn { 
                evpn {
                    rapid-update true
                }
            }            
            group ebgp-underlay {
                admin-state enable
                export-policy [ export-to-underlay ]
                import-policy [ import-from-underlay ]
                afi-safi ipv4-unicast {
                    admin-state enable
                }
                afi-safi ipv6-unicast {
                    admin-state enable
                }
                afi-safi evpn {
                    admin-state enable
                }                
                failure-detection {
                    enable-bfd true
                    fast-failover true
                }
                timers {
                    connect-retry 10
                    hold-time 0
                    keepalive-interval 1
                    minimum-advertisement-interval 1
                }
            }
            neighbor 169.254.0.0 {
                admin-state enable
                peer-as 64601
                peer-group ebgp-underlay
            }
            neighbor 169.254.0.2 {
                admin-state enable
                peer-as 64601
                peer-group ebgp-underlay
            }
        }
    }
}

#--------------------------------------------------
echo "Underlay / BGP EVPN"
#--------------------------------------------------
network-instance default {
    protocols {
        bgp {
            group ibgp-evpn {
                admin-state enable
                export-policy [ export-all ]
                import-policy [ import-all ]
                peer-as 65501
                failure-detection {
                    enable-bfd true
                    fast-failover true
                }
                afi-safi ipv4-unicast {
                    admin-state disable
                }
                afi-safi ipv6-unicast {
                    admin-state disable
                }
                afi-safi evpn {
                    admin-state enable
                }
                local-as {
                    as-number 65501
                    prepend-global-as false
                }
                timers {
                    connect-retry 10
                    hold-time 0
                    keepalive-interval 1
                    minimum-advertisement-interval 1
                }
                transport {
                    local-address 10.0.0.2
                }
            }
            neighbor 10.0.0.1 {
                admin-state enable
                peer-group ibgp-evpn
                transport {
                    local-address 10.0.0.2
                }
            }
        }
    }
}
routing-policy {
    policy import-all {
        default-action {
            policy-result accept
        }
    }
    policy export-all {
        default-action {
            policy-result accept
        }
    }
}
system {
    network-instance {
        protocols {
            evpn {
                ethernet-segments {
                    timers {
                        boot-timer 10
                        activation-timer  3
                    }
                }
            }
            bgp-vpn {
                bgp-instance 1 {
                }
            }
        }
    }
}
#--------------------------------------------------
echo "Underlay / Routing Policies"
#--------------------------------------------------
routing-policy {
   prefix-set loopbacks {
        prefix 10.0.0.2/32 mask-length-range 32..32 { 
        }
   }
   policy export-to-underlay {
        default-action {
            policy-result reject
        }
        statement 20 {
            match {
                prefix-set loopbacks
            }
            action {
                policy-result accept
            }
        }
        statement 30 {
            match {
                family [
                    ipv4-unicast
                    ipv6-unicast
                ]
                protocol bgp
            }
            action {
                policy-result accept
            }
        }
   }
   policy import-from-underlay {
        default-action {
            policy-result reject
        }
        statement 20 {
           match {
            prefix-set loopbacks
            }
           action {
            policy-result accept
            }
       }
        statement 30 {
            match {
                family [
                    ipv4-unicast
                    ipv6-unicast
                ]
                protocol bgp
            }
            action {
                policy-result accept
            }
        }
    }
}

